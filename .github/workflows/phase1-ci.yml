name: Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: insighthr_test
          POSTGRES_USER: insighthr_test
          POSTGRES_PASSWORD: insighthr-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insighthr_test -d insighthr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://insighthr_test:insighthr-test-password@127.0.0.1:5432/insighthr_test
      TEST_DATABASE_URL: postgresql+psycopg://insighthr_test:insighthr-test-password@127.0.0.1:5432/insighthr_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: python -m pip install --constraint requirements.lock -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check app tests alembic
      - run: python -m mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet
      - name: Prepare nested environment-file canary
        run: |
          printf 'IMAGE_SECRET_CANARY=must-not-be-packaged\n' > apps/api/.env
          printf 'IMAGE_SECRET_CANARY=must-not-be-packaged\n' > apps/web/.env.production
      - name: Build API image
        run: |
          set -o pipefail
          docker compose --project-name insighthr-ci --env-file .env.example build --progress plain api 2>&1 | tee api-build.log || {
            echo '### API image build failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 api-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Build web image
        run: |
          set -o pipefail
          docker compose --project-name insighthr-ci --env-file .env.example build --progress plain web 2>&1 | tee web-build.log || {
            echo '### Web image build failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 web-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Start clean stack
        run: |
          set -o pipefail
          docker compose --project-name insighthr-ci --env-file .env.example up --detach --wait --no-build 2>&1 | tee stack-start.log || {
            while IFS= read -r line; do
              echo "::error title=Clean Compose startup::${line}"
            done < <(tail -n 40 stack-start.log)
            exit 1
          }
      - name: Verify health and web-to-API connectivity
        run: |
          test "$(docker compose --project-name insighthr-ci --env-file .env.example ps --all --quiet migrate | wc -l)" -eq 1
          test "$(docker inspect --format '{{.State.ExitCode}}' insighthr-ci-migrate-1)" -eq 0
          curl --fail --silent http://127.0.0.1:8000/health/live | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8000/health/ready | grep '"status":"ready"'
          curl --fail --silent http://127.0.0.1:3000 | grep 'API connected'
      - name: Inspect final images
        run: |
          test "$(docker image inspect insighthr-api:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect insighthr-web:local --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint python insighthr-api:local -c "import importlib.util; assert importlib.util.find_spec('pytest') is None"
          docker run --rm --entrypoint sh insighthr-api:local -c 'test -z "$(find /app -type f \( -name .env -o -name ".env.*" \) -print -quit)"'
          docker run --rm --entrypoint sh insighthr-web:local -c 'test -z "$(find /app -type f \( -name .env -o -name ".env.*" \) -print -quit)"'
      - name: Verify persistence across normal restart
        run: |
          revision_before="$(docker compose --project-name insighthr-ci --env-file .env.example exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT version_num FROM alembic_version"' | tr -d '[:space:]')"
          test "$revision_before" = "20261003_0001"
          docker compose --project-name insighthr-ci --env-file .env.example down
          docker compose --project-name insighthr-ci --env-file .env.example up --detach --wait --no-build
          revision_after="$(docker compose --project-name insighthr-ci --env-file .env.example exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT version_num FROM alembic_version"' | tr -d '[:space:]')"
          test "$revision_after" = "$revision_before"
          curl --fail --silent http://127.0.0.1:8000/health/ready | grep '"status":"ready"'
          curl --fail --silent http://127.0.0.1:3000 | grep 'API connected'
      - name: Show service logs after failure
        if: failure()
        run: |
          docker compose --project-name insighthr-ci ps --all || true
          docker compose --project-name insighthr-ci logs --no-color || true
          echo '### Docker service failure' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          docker compose --project-name insighthr-ci ps --all >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          docker compose --project-name insighthr-ci logs --no-color --tail 200 >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove CI stack
        if: always()
        run: docker compose --project-name insighthr-ci down --volumes

