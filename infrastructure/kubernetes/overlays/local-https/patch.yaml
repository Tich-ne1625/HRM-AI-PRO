apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: production
  WEB_ORIGIN: https://insighthr.test:13443
  COOKIE_SECURE: 'true'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  tls:
  - hosts:
    - insighthr.test
    secretName: local-tls
  rules:
  - host: insighthr.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 3000
