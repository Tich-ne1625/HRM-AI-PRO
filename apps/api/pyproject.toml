[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insighthr-api"
version = "0.1.0"
description = "InsightHR modular monolith API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.142.2",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.3",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.3",
  "ruff==0.16.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires a PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

